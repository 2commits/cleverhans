[workspace]
members = [
    "crates/cleverhans",
    "crates/cleverhans-codegen",
    "crates/cleverhans-conformance",
    "crates/cleverhans-core",
    "crates/cleverhans-demo",
    "crates/cleverhans-evals",
    "crates/cleverhans-ffi",
    "crates/cleverhans-grpc",
    "crates/cleverhans-llm-anthropic",
    "crates/cleverhans-llm-ollama",
    "crates/cleverhans-node",
    "crates/cleverhans-py",
    "crates/cleverhans-ws",
    "crates/cleverhans-ws-core",
]
# The binding crates are excluded from default-members: cleverhans-py links
# via the Python interpreter (maturin builds/tests it through pytest) and
# cleverhans-node's tests run through napi + vitest. Plain `cargo test` and
# `cargo clippy` skip BOTH — lint them explicitly with
# `cargo clippy -p cleverhans-py -p cleverhans-node`.
default-members = [
    "crates/cleverhans",
    "crates/cleverhans-codegen",
    "crates/cleverhans-conformance",
    "crates/cleverhans-core",
    "crates/cleverhans-demo",
    "crates/cleverhans-evals",
    "crates/cleverhans-ffi",
    "crates/cleverhans-grpc",
    "crates/cleverhans-llm-anthropic",
    "crates/cleverhans-llm-ollama",
    "crates/cleverhans-ws",
    "crates/cleverhans-ws-core",
]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/2commits/cleverhans"

[workspace.dependencies]
# Internal crates carry both `path` (workspace builds) and `version`
# (crates.io resolution) — `cargo publish` rejects path-only dependencies.
# conformance/ffi stay `publish = false`; they carry a version anyway so
# `cargo package --workspace` can verify the crates that depend on them.
cleverhans-core = { path = "crates/cleverhans-core", version = "0.1.3" }
cleverhans-ws-core = { path = "crates/cleverhans-ws-core", version = "0.1.3" }
cleverhans-ws = { path = "crates/cleverhans-ws", version = "0.1.3" }
cleverhans-llm-anthropic = { path = "crates/cleverhans-llm-anthropic", version = "0.1.3" }
cleverhans-llm-ollama = { path = "crates/cleverhans-llm-ollama", version = "0.1.3" }
cleverhans-evals = { path = "crates/cleverhans-evals", version = "0.1.3" }
cleverhans-codegen = { path = "crates/cleverhans-codegen", version = "0.1.3" }
cleverhans = { path = "crates/cleverhans", version = "0.1.3" }
cleverhans-conformance = { path = "crates/cleverhans-conformance", version = "0.1.3" }
cleverhans-ffi = { path = "crates/cleverhans-ffi", version = "0.1.3" }

async-stream = "0.3"
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-stream = "0.1"
tracing = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 1 }
