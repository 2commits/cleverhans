[workspace]
members = [
    "crates/cleverhans-codegen",
    "crates/cleverhans-core",
    "crates/cleverhans-grpc",
    "crates/cleverhans-llm-anthropic",
    "crates/cleverhans-ws",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nordalf/cleverhans"

[workspace.dependencies]
async-trait = "0.1"
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-stream = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 1 }
