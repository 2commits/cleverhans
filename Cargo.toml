[workspace]
members = [
    "crates/cleverhans",
    "crates/cleverhans-codegen",
    "crates/cleverhans-conformance",
    "crates/cleverhans-core",
    "crates/cleverhans-demo",
    "crates/cleverhans-evals",
    "crates/cleverhans-ffi",
    "crates/cleverhans-grpc",
    "crates/cleverhans-llm-anthropic",
    "crates/cleverhans-llm-ollama",
    "crates/cleverhans-node",
    "crates/cleverhans-py",
    "crates/cleverhans-ws",
    "crates/cleverhans-ws-core",
]
# The binding crates are excluded from default-members: cleverhans-py links
# via the Python interpreter (maturin builds/tests it through pytest) and
# cleverhans-node's tests run through napi + vitest. Plain `cargo test` and
# `cargo clippy` skip BOTH — lint them explicitly with
# `cargo clippy -p cleverhans-py -p cleverhans-node`.
default-members = [
    "crates/cleverhans",
    "crates/cleverhans-codegen",
    "crates/cleverhans-conformance",
    "crates/cleverhans-core",
    "crates/cleverhans-demo",
    "crates/cleverhans-evals",
    "crates/cleverhans-ffi",
    "crates/cleverhans-grpc",
    "crates/cleverhans-llm-anthropic",
    "crates/cleverhans-llm-ollama",
    "crates/cleverhans-ws",
    "crates/cleverhans-ws-core",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nordalf/cleverhans"

[workspace.dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
prost = "0.14"
prost-types = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt"] }
tokio-stream = "0.1"
tracing = "0.1"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard-style = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = 1 }
