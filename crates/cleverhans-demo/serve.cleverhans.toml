# `cleverhans serve` config paired with `cleverhans-demo host` — the
# recommended way to test the standalone service binary with a real,
# stateful backend and the React playground:
#
#   # terminal 1 — the demo document store behind the §14 webhooks
#   cargo run -p cleverhans-demo -- host
#
#   # terminal 2 — the service under test (bind 8787 so the playground
#   # connects unchanged)
#   CLEVERHANS_UPSTREAM_SECRET=dev-secret ANTHROPIC_API_KEY=... \
#     cargo run -p cleverhans-serve --bin cleverhans -- serve \
#       --registry crates/cleverhans-demo/registry.json \
#       --config crates/cleverhans-demo/serve.cleverhans.toml \
#       --bind 127.0.0.1:8787
#
#   # terminal 3 — the click-around UI (its dev server proxies the doc list
#   # to whichever demo backend is up, here the host on 8791)
#   pnpm --filter @cleverhans/playground dev
#
# Renames/publishes/deletes then execute in the host's store over the
# webhooks and fold back into the playground page. Restart the host to
# reseed.

[server]
bind = "127.0.0.1:8787"
path = "/agent"

[upstream]
base_url = "http://127.0.0.1:8791"
secret_env = "CLEVERHANS_UPSTREAM_SECRET"

[auth]
verify = "POST /cleverhans/verify_session"

[authz]
endpoint = "POST /cleverhans/authorize"

[llm]
provider = "anthropic"          # or: provider = "ollama", model = "qwen3"

# OTLP metrics export (spec'd metric set in docs/hosting-webhooks.md).
# Off unless an endpoint is set here or via OTEL_EXPORTER_OTLP_ENDPOINT.
# [telemetry]
# otlp_endpoint = "http://localhost:4318"
# service_name = "cleverhans"
# export_interval_ms = 10000

[agent]
app_instructions = "You are the assistant inside a document-management app. Keep answers short."

[actions."*"]
execute = "POST /cleverhans/execute"
dry_run = "POST /cleverhans/dry_run"

# Slot phrasing: document.rename uses the §14.9 build_slots endpoint, so
# the host's real slot builder phrases the card dynamically ("New title:
# …") — the other actions show the declarative style.
[actions."document.rename"]
execute = "POST /cleverhans/execute"
dry_run = "POST /cleverhans/dry_run"
build_slots = "POST /cleverhans/build_slots"

[actions."document.publish".slots]
title = { const = "Publish document" }
detail = { preview = "summary" }

[actions."document.archive".slots]
title = { const = "Archive document" }
detail = { preview = "summary" }

[actions."documents.deleteByStatus".slots]
title = { const = "Bulk delete documents" }
