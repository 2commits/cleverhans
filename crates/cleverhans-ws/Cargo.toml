[package]
name = "cleverhans-ws"
description = "WebSocket + JSON transport binding for the CleverHans envelope (axum)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
cleverhans-core = { path = "../cleverhans-core" }
cleverhans-ws-core = { path = "../cleverhans-ws-core" }
futures-util = { version = "0.3", default-features = false }
tokio = { workspace = true, features = ["sync"] }

[lints]
workspace = true
