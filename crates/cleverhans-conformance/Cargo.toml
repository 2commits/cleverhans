[package]
name = "cleverhans-conformance"
description = "Language-neutral conformance vector runner for the CleverHans protocol"
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
cleverhans-core = { workspace = true }
cleverhans-webhook = { workspace = true }
cleverhans-ws-core = { workspace = true }
futures-util = { workspace = true }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
