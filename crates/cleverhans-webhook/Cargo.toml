[package]
name = "cleverhans-webhook"
description = "Host webhook contract (spec §14) for the CleverHans standalone service topology: wire types, HTTP client, and seam implementations"
version.workspace = true
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = { workspace = true }
cleverhans-core = { workspace = true }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
