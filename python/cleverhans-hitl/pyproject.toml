[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "cleverhans-hitl"
version = "0.1.0"
description = "CleverHans propose-only HITL agent framework — Python binding"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
keywords = ["agent", "hitl", "llm", "human-in-the-loop"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/nordalf/cleverhans"
Specification = "https://github.com/nordalf/cleverhans/blob/main/spec/SPEC.md"

[tool.maturin]
manifest-path = "../../crates/cleverhans-py/Cargo.toml"
module-name = "cleverhans_agent._native"
python-source = "src"
