[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "cleverhans"
version = "0.1.0"
description = "CleverHans propose-only HITL agent framework — Python binding"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }

[tool.maturin]
manifest-path = "../../crates/cleverhans-py/Cargo.toml"
module-name = "cleverhans._native"
python-source = "src"
