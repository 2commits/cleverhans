name: Release

# Publishes on version tags (v0.1.0):
#   crates.io — the 9 publishable crates (publish = false crates are skipped)
#   npm       — @cleverhans/react, @cleverhans/ui, @cleverhans/node (+ per-platform binaries)
#   PyPI      — cleverhans-hitl abi3 wheels (linux x64/arm64, macOS x64/arm64, windows x64) + sdist
#
# Required repo config: CARGO_REGISTRY_TOKEN and NPM_TOKEN secrets; PyPI
# trusted publishing for this workflow (no token).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-native:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build native module
        run: >
          pnpm exec napi build --platform --release
          --manifest-path ../../crates/cleverhans-node/Cargo.toml
          --target ${{ matrix.settings.target }} --output-dir .
        working-directory: typescript/cleverhans-node
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.settings.target }}
          path: typescript/cleverhans-node/*.node
          if-no-files-found: error

  npm:
    needs: npm-native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: typescript/cleverhans-node/artifacts
          merge-multiple: true
      - name: Stage platform packages
        working-directory: typescript/cleverhans-node
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts
      - name: Build JS/TS packages
        run: pnpm -r build
        working-directory: typescript
      - name: Publish platform packages
        run: pnpm exec napi prepublish -t npm --skip-gh-release
        working-directory: typescript/cleverhans-node
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish workspace packages
        run: >
          pnpm publish -r --access public --no-git-checks
          --filter @cleverhans/react --filter @cleverhans/ui --filter @cleverhans/node
          --filter create-cleverhans
        working-directory: typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi-wheels:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64
          - host: ubuntu-24.04-arm
            target: aarch64
          - host: macos-latest
            target: aarch64
          - host: macos-latest
            target: x86_64
          - host: windows-latest
            target: x64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python/cleverhans-hitl
          target: ${{ matrix.settings.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.settings.host }}-${{ matrix.settings.target }}
          path: python/cleverhans-hitl/dist
          if-no-files-found: error

  pypi-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python/cleverhans-hitl
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: python/cleverhans-hitl/dist
          if-no-files-found: error

  pypi:
    needs: [pypi-wheels, pypi-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
