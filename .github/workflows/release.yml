name: Release

# Publishes on version tags (v0.1.0):
#   crates.io — the 8 publishable crates (publish = false crates are skipped)
#   npm       — @cleverhans/react, @cleverhans/ui, @cleverhans/node (+ per-platform binaries)
#   PyPI      — cleverhans-hitl abi3 wheels (linux x64/arm64, macOS x64/arm64, windows x64) + sdist
#
# Required repo config: a `release` GitHub environment holding the
# CARGO_REGISTRY_TOKEN secret. npm and PyPI use trusted publishing (OIDC,
# no tokens): configure this repo + release.yml + environment `release`
# as a trusted publisher on npmjs.com (per package) and on PyPI.
#
# Semver: only vMAJOR.MINOR.PATCH[-prerelease] tags trigger; the `semver`
# job validates the tag and requires every manifest version to match it
# before anything publishes. Prerelease tags (v1.2.0-rc.1) publish to npm
# under the `next` dist-tag, never `latest`; crates.io and PyPI treat
# prerelease versions as opt-in natively. Bump every manifest in one go
# with scripts/set-version.sh — see docs/releasing.md.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  semver:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      dist-tag: ${{ steps.parse.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag is strict semver
        id: parse
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "$TAG" | grep -Eq \
            '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$' \
            || { echo "::error::tag v$TAG is not valid semver"; exit 1; }
          case "$TAG" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *)   echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
      - name: Every manifest version matches the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          fail=0
          check() {
            if [ "$2" != "$TAG" ]; then
              echo "::error::$1 says $2, tag says $TAG"
              fail=1
            fi
          }
          check "Cargo.toml [workspace.package]" \
            "$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          check "python/cleverhans-hitl/pyproject.toml" \
            "$(grep -m1 '^version = ' python/cleverhans-hitl/pyproject.toml | cut -d'"' -f2)"
          for p in cleverhans-react cleverhans-ui cleverhans-node create-cleverhans; do
            check "typescript/$p/package.json" \
              "$(node -p "require('./typescript/$p/package.json').version")"
          done
          exit $fail

  crates:
    needs: semver
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Skip-existing + 429-aware: crates.io rate-limits new crate names,
      # so a first release publishes in waves; re-runs resume where the
      # last attempt stopped.
      - run: ./scripts/publish-crates.sh
        timeout-minutes: 120
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  npm-native:
    needs: semver
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - host: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      - name: Build native module
        run: >
          pnpm exec napi build --platform --release
          --manifest-path ../../crates/cleverhans-node/Cargo.toml
          --target ${{ matrix.settings.target }} --output-dir .
        working-directory: typescript/cleverhans-node
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: typescript/cleverhans-node/*.node
          if-no-files-found: error

  npm:
    needs: [semver, npm-native]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # npm trusted publishing (OIDC): no NPM_TOKEN anywhere. Each package
      # must have this repo + workflow (+ environment `release`) configured
      # as a trusted publisher on npmjs.com. Provenance is automatic.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
        working-directory: typescript
      - uses: actions/download-artifact@v8
        with:
          path: typescript/cleverhans-node/artifacts
          merge-multiple: true
      - name: Stage platform packages
        working-directory: typescript/cleverhans-node
        run: |
          pnpm exec napi create-npm-dirs
          pnpm exec napi artifacts --output-dir artifacts
      - name: Build JS/TS packages
        run: pnpm -r build
        working-directory: typescript
      - name: Already published? (bootstrap runs publish outside CI)
        id: published
        run: |
          V="${{ needs.semver.outputs.version }}"
          if npm view "@cleverhans/node@$V" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "@cleverhans/node@$V already on npm — skipping npm publishes"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish platform packages
        # napi shells out to `npm publish`, which picks up OIDC itself.
        if: steps.published.outputs.skip != 'true'
        run: pnpm exec napi prepublish -t npm --no-gh-release
        working-directory: typescript/cleverhans-node
        env:
          # npm's default-dist-tag config: prerelease versions land on
          # `next`, stable on `latest`.
          NPM_CONFIG_TAG: ${{ needs.semver.outputs.dist-tag }}
      - name: Publish workspace packages
        # pnpm pack applies publishConfig + rewrites workspace:* deps;
        # npm publish (>= 11.5.1) does the OIDC exchange.
        if: steps.published.outputs.skip != 'true'
        working-directory: typescript
        run: |
          for p in cleverhans-react cleverhans-ui cleverhans-node create-cleverhans; do
            (cd "$p" \
              && pnpm pack --out package.tgz \
              && npm publish package.tgz --access public \
                   --tag "${{ needs.semver.outputs.dist-tag }}")
          done

  pypi-wheels:
    needs: semver
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: ubuntu-latest
            target: x86_64
          - host: ubuntu-24.04-arm
            target: aarch64
          - host: macos-latest
            target: aarch64
          - host: macos-latest
            target: x86_64
          - host: windows-latest
            target: x64
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python/cleverhans-hitl
          target: ${{ matrix.settings.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.settings.host }}-${{ matrix.settings.target }}
          path: python/cleverhans-hitl/dist
          if-no-files-found: error

  pypi-sdist:
    needs: semver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python/cleverhans-hitl
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: python/cleverhans-hitl/dist
          if-no-files-found: error

  pypi:
    needs: [pypi-wheels, pypi-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # Re-runs skip files PyPI already has instead of failing.
          skip-existing: true
