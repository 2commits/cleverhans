name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  # The §14 contract stays implementable from the spec alone: the
  # dependency-free reference host (no shared code with the framework)
  # must pass host-check, signatures required.
  host-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cargo build -p cleverhans-serve
      - name: host-check against the reference host
        run: |
          CLEVERHANS_SECRET=ci-secret CLEVERHANS_SIGNING_KEY=ci-signing-key \
            node docs/examples/node-host/host.js &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:3000 && break || sleep 0.5
          done
          ./target/debug/cleverhans host-check \
            --base-url http://127.0.0.1:3000 \
            --secret ci-secret --signing-key ci-signing-key

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: typescript/package.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: typescript/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r test
      - name: Generated types are fresh
        run: pnpm codegen:check

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install maturin pytest
      - run: maturin build --out dist
        working-directory: python/cleverhans-hitl
      - run: pip install python/cleverhans-hitl/dist/*.whl
      - run: pytest tests/ -q
        working-directory: python/cleverhans-hitl

  package:
    # Publishability gate: every publishable crate must package cleanly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Full verify (no --no-verify): builds each crate from its packaged
      # tarball, catching files that live outside the crate directory —
      # exactly what `cargo publish` will do at release time.
      - run: >
          cargo package --workspace
          --exclude cleverhans-ffi
          --exclude cleverhans-py --exclude cleverhans-node
          --exclude cleverhans-demo
