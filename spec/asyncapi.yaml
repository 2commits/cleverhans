# AsyncAPI description of the WebSocket + JSON binding of the CleverHans
# envelope, as the reference implementation runs it: the session loop in
# crates/cleverhans-ws-core, its axum adapter crates/cleverhans-ws, and the
# browser side in typescript/cleverhans-react/src/websocket.ts.
#
# The payloads are not copied here: each message points at its entry in
# schemas/client-event.json or schemas/server-event.json. Check this file from
# typescript/ with `pnpm spec:check` (scripts/check-asyncapi.mjs); CI's web job
# runs it.
asyncapi: 3.1.0

info:
  title: CleverHans envelope over WebSocket + JSON
  version: '0.1'
  description: |
    The WebSocket + JSON binding of the CleverHans envelope
    ([SPEC.md](https://github.com/2commits/cleverhans/blob/main/spec/SPEC.md)
    §6, §11), as the reference implementation runs it. `SPEC.md` stays
    normative; this document describes one binding of it. `info.version` is
    the wire version (`Init.spec_version`, SPEC.md §13).

    The document is written from the point of view of the **app frontend**:
    it sends the five `ClientEvent` messages and receives the four
    `ServerEvent` messages. The agent does the mirror image.

    ## Connection and authentication

    One WebSocket connection carries one session (SPEC.md §6.1), bound to one
    principal. The frontend opens it with an HTTP `GET` upgrade request to a
    path the host chooses (the reference crates take it as an argument;
    `/agent` is what the demo, the examples and `cleverhans serve` use).

    Authentication is the host's choice (SPEC.md §10): the host maps the
    upgrade request's headers (cookie, bearer token, …) to its principal
    before the upgrade is accepted. A refused request gets an HTTP status
    (typically `401`; `cleverhans serve` answers `503` when its
    `verify_session` webhook fails) and never becomes a socket, so no
    envelope traffic flows on an unauthenticated stream. The envelope itself
    never carries credentials.

    ## Subprotocol

    The binding has one subprotocol name, `cleverhans.v0.1` (the wire
    version). The server selects it whenever the client offers it; the
    axum adapter does this on every upgrade (`cleverhans_ws::SUBPROTOCOL`).
    Every other value the client offers stays in the upgrade request's
    `Sec-WebSocket-Protocol` header for the host's principal extractor to
    read: a browser cannot set other headers on a WebSocket, so a token
    often travels that way (`cleverhans_ws::offered_subprotocols` lists
    those values). A client that offers no subprotocol connects without
    one, and the server then sends no `Sec-WebSocket-Protocol` header.

    The reference frontend offers `cleverhans.v0.1` first, then the
    caller's values, whenever its caller passes `protocols`, and offers
    nothing otherwise: a browser fails the connection when it offers a
    subprotocol and the server selects none. Hosts that run their own
    WebSocket server under the Node or Python binding select the name
    themselves (the `ws` library's default selects the first value the
    client offers, which is this name).

    Also the host's choice, because the binding does none of it: checking
    the `Origin` header (a host that authenticates by cookie should, in its
    principal extractor or middleware), sending heartbeats, idle timeouts
    and message size limits (the WebSocket library's defaults apply). Pings
    from the client are answered by the WebSocket library, not by the
    binding.

    ## Frames

    - Each text frame carries exactly one envelope message: a JSON object
      whose `type` names the message in snake_case, its fields beside the
      tag. The server sends each `ServerEvent` as its own text frame.
    - Binary frames carry nothing: the server drops them without an answer,
      and they do not count as a message (a binary frame before `Init` does
      not trigger `init_required`). The reference frontend never sends one.
    - A text frame that is a JSON object whose `type` is a string the
      receiver does not know is ignored without an answer (SPEC.md §13): the
      envelope grows by new message types. It does not count as a message
      either, so the next one must still be `Init`. The reference frontend
      likewise ignores a `ServerEvent` type it does not know.
    - Delivery is ordered in each direction. The server handles one inbound
      frame at a time: it reads the next frame only after the turn the
      previous one started has finished (a streamed reply, a confirmed
      action's execution). Frames sent meanwhile wait in order; nothing
      cancels a running turn.
    - Unknown fields in a message are ignored in both directions (SPEC.md
      §13).

    ## Session

    1. **`Init` first.** The first message the server decodes must be
       `Init` (SPEC.md §6.1). Any other known message is answered with
       `Error` `init_required` (`recoverable: false`), which ends the
       session (item 6). A frame that fails to decode does not count as the
       first message: it gets `malformed_event` and the next frame must
       still be `Init`. A message of an unknown type does not count either:
       it is ignored. The reference frontend queues events until the socket
       is open and sends `Init` first.
    2. **Version.** An `Init` whose `spec_version` does not share the
       server's major.minor prefix (`0.1`, on a segment boundary: `0.1`,
       `0.1.0`, `0.1.0-draft`) is answered with `Error`
       `unsupported_spec_version` (`recoverable: false`) and its context is
       not applied. The error ends the session (item 6).
    3. **Malformed frames.** A text frame that is not valid JSON, is not an
       object, has no `type` or a `type` that is not a string, or has a
       known `type` but lacks a required field or has one of the wrong type
       is answered with `Error` `malformed_event` (`recoverable: true`,
       `message` is the decoder's error text). The session continues. A
       message whose `type` is a string the server does not know is not
       malformed: it is ignored without an answer (see Frames).
    4. **Later `Init`.** A second `Init` is accepted without an error: it
       replaces the context snapshot and resets the server's `context_seq`
       to 0. Proposals and conversation history stay.
    5. **Turns.** `UserMessage` starts a model turn: zero or more
       `ChatMessage` segments (streamed as `done: false` fragments, closed
       by one authoritative `done: true` message) and `ActionProposal`
       messages, or an `Error` `llm_error`. `ConfirmAction` and
       `RejectAction` are answered with one `ProposalStateChanged` or one
       `Error`. `ContextUpdate` is answered with nothing, or with one
       `ProposalStateChanged` `expired` per pending proposal when the
       `route` changed (SPEC.md §7.4), or with `Error` `stale_context`
       (`recoverable: true`) when its `context_seq` is not greater than the
       last one the session applied; a stale update is not applied
       (SPEC.md §6.2).
    6. **End.** An `Error` with `recoverable: false` ends the session
       (SPEC.md §6.3): it is the last event the server sends, the server
       processes no further frame, and it closes the connection with a
       WebSocket close frame, code `1008` (policy violation), the error's
       `code` as the reason (`init_required`, `unsupported_spec_version`).
       It then waits briefly for the client's close frame. The session also
       ends when the client closes the connection (the server answers its
       close frame) or when the server can no longer write to it. A turn in
       progress when the client leaves runs to completion, including the
       execution of a confirmed action; its remaining events are dropped.
       A new connection is a new session: proposals of an earlier connection
       are unknown to it.

    ## Frontend side

    `createWebSocketTransport` in `@cleverhans/react` serializes each
    `ClientEvent` with `JSON.stringify` into one text frame and parses each
    inbound text frame with `JSON.parse`. A frame that does not parse is
    reported to the optional `onTransportError` callback and skipped; it
    does not end the session. The session ignores a `ServerEvent` whose
    `type` it does not know, and treats an unknown proposal `state` as
    terminal (SPEC.md §11). Given `protocols`, the transport offers
    `cleverhans.v0.1` first and the caller's values after it (see
    Subprotocol); without, it offers none.
